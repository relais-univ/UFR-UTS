<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - UTS Social</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js",
                "firebase/storage": "https://www.gstatic.com/firebasejs/11.0.0/firebase-storage.js"
            }
        }
    </script>
    <style>
        .uts-green { background-color: #008751; }
        .admin-card { transition: all 0.3s ease; }
        .admin-card:hover { transform: translateY(-3px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
        .tab-active { background-color: #008751; color: white; }
        .tab-inactive { background-color: #e5e7eb; color: #374151; }
        .preview-box { border: 2px dashed #cbd5e1; transition: all 0.2s; }
        .preview-box:hover { border-color: #008751; }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <div id="loginScreen" class="fixed inset-0 z-[300] bg-gray-100 flex items-center justify-center">
        <div class="bg-white rounded-2xl p-8 w-[90%] max-w-md shadow-xl text-center">
            <div class="uts-logo w-20 h-20 bg-white rounded-full flex items-center justify-center text-3xl font-bold mx-auto shadow-md" style="background: white;">
                <span style="color: #EF4444;">U</span><span style="color: #EAB308;">T</span><span style="color: #22C55E;">S</span>
            </div>
            <h2 class="text-2xl font-bold mt-4 text-gray-800">Administration</h2>
            <p class="text-gray-500 text-sm mb-6">Espace réservé</p>
            <input type="password" id="adminPassword" placeholder="Mot de passe" class="input-pro w-full mb-4 text-center" style="background: #f3f4f6; border-radius: 15px; padding: 12px;">
            <button onclick="checkAdminPassword()" class="w-full uts-green text-white py-3 rounded-xl font-bold">SE CONNECTER</button>
            <p class="text-xs text-gray-400 mt-4">Accès restreint</p>
        </div>
    </div>

    <div id="adminContent" class="hidden">
        <header class="uts-green text-white p-4 sticky top-0 z-50 shadow-md flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="uts-logo w-10 h-10 bg-white rounded-full flex items-center justify-center text-xl font-bold">
                    <span style="color: #EF4444;">U</span><span style="color: #EAB308;">T</span><span style="color: #22C55E;">S</span>
                </div>
                <h1 class="text-lg font-bold">Administration</h1>
            </div>
            <button onclick="logoutAdmin()" class="bg-red-600 text-white px-4 py-1 rounded-full text-sm font-bold">🔒 Déconnexion</button>
        </header>

        <main class="max-w-4xl mx-auto p-4">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
                <div class="bg-white rounded-xl p-3 text-center shadow-sm">
                    <i class="fas fa-newspaper text-2xl text-green-600"></i>
                    <p class="text-2xl font-bold" id="totalArticles">0</p>
                    <p class="text-xs text-gray-500">Articles</p>
                </div>
                <div class="bg-white rounded-xl p-3 text-center shadow-sm">
                    <i class="fas fa-graduation-cap text-2xl text-green-600"></i>
                    <p class="text-2xl font-bold" id="totalNotes">0</p>
                    <p class="text-xs text-gray-500">Notes</p>
                </div>
                <div class="bg-white rounded-xl p-3 text-center shadow-sm">
                    <i class="fas fa-users text-2xl text-green-600"></i>
                    <p class="text-2xl font-bold" id="totalUsers">0</p>
                    <p class="text-xs text-gray-500">Étudiants</p>
                </div>
                <div class="bg-white rounded-xl p-3 text-center shadow-sm">
                    <i class="fas fa-clock text-2xl text-green-600"></i>
                    <p class="text-2xl font-bold" id="expiredCount">0</p>
                    <p class="text-xs text-gray-500">À nettoyer</p>
                </div>
            </div>

            <div class="flex gap-2 mb-6 overflow-x-auto pb-2">
                <button onclick="showTab('articles')" id="tabArticles" class="tab-active px-4 py-2 rounded-full font-bold text-sm transition">📝 Articles</button>
                <button onclick="showTab('notes')" id="tabNotes" class="tab-inactive px-4 py-2 rounded-full font-bold text-sm transition">📚 Notes</button>
                <button onclick="showTab('import')" id="tabImport" class="tab-inactive px-4 py-2 rounded-full font-bold text-sm transition">📁 Import CSV</button>
                <button onclick="showTab('cleanup')" id="tabCleanup" class="tab-inactive px-4 py-2 rounded-full font-bold text-sm transition">🗑️ Nettoyage</button>
            </div>

            <div id="articlesTab" class="space-y-4">
                <div class="bg-white rounded-2xl p-5 shadow-sm">
                    <h2 class="text-xl font-bold text-green-700 mb-4">📝 Publier un article</h2>
                    
                    <div class="grid md:grid-cols-2 gap-4">
                        <div>
                            <input type="text" id="articleTitle" placeholder="Titre de l'article" class="input-pro w-full mb-3 border p-2 rounded-xl">
                            <textarea id="articleContent" rows="6" placeholder="Contenu de l'article..." class="input-pro w-full mb-3 border p-2 rounded-xl"></textarea>
                            
                            <div class="mb-3">
                                <label class="uts-green text-white px-4 py-2 rounded-xl cursor-pointer text-sm inline-flex items-center gap-2">
                                    <i class="fas fa-plus"></i> Choisir une photo
                                    <input type="file" id="articleImage" accept="image/*" class="hidden" onchange="previewArticleImage(event)">
                                </label>
                                <div id="imagePreviewContainer" class="mt-2 hidden">
                                    <img id="imagePreview" class="w-24 h-24 rounded object-cover border">
                                    <button onclick="removeImage()" class="text-red-500 text-xs mt-1">🗑️ Supprimer</button>
                                </div>
                            </div>
                            
                            <div class="grid grid-cols-2 gap-3 mb-4">
                                <select id="expiryType" class="input-pro border p-2 rounded-xl">
                                    <option value="never">Jamais (suppression manuelle)</option>
                                    <option value="7">7 jours</option>
                                    <option value="30">30 jours</option>
                                    <option value="custom">Date personnalisée</option>
                                </select>
                                <input type="date" id="customExpiry" class="input-pro hidden border p-2 rounded-xl">
                            </div>
                            <button onclick="publishArticle()" class="uts-green text-white px-6 py-2 rounded-xl font-bold">📤 Publier</button>
                        </div>
                        
                        <div class="border rounded-xl p-4 bg-gray-50 preview-box">
                            <h3 class="font-bold text-gray-700 mb-2 flex items-center gap-2"><i class="fas fa-eye"></i> Aperçu en direct</h3>
                            <div id="previewTitle" class="font-bold text-green-700 text-lg mb-2">Titre de l'article</div>
                            <div id="previewContent" class="text-sm text-gray-700 whitespace-pre-wrap">Le contenu apparaîtra ici...</div>
                            <div id="previewImageBox" class="mt-2"></div>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-2xl p-5 shadow-sm">
                    <h2 class="text-xl font-bold text-green-700 mb-4">📋 Articles publiés</h2>
                    <div id="articlesList" class="space-y-3 max-h-96 overflow-y-auto">
                        <p class="text-gray-400 text-center py-4">Chargement...</p>
                    </div>
                </div>
            </div>

            <div id="notesTab" class="hidden space-y-4">
                <div class="bg-white rounded-2xl p-5 shadow-sm">
                    <h2 class="text-xl font-bold text-green-700 mb-4">➕ Ajouter une note</h2>
                    <div class="grid grid-cols-2 gap-3">
                        <input type="text" id="noteIne" placeholder="INE *" class="input-pro border p-2 rounded-xl">
                        <input type="text" id="noteMatiere" placeholder="Matière *" class="input-pro border p-2 rounded-xl">
                        <input type="number" id="noteValue" placeholder="Note /20 *" class="input-pro border p-2 rounded-xl" step="0.5">
                        <select id="noteSemestre" class="input-pro border p-2 rounded-xl">
                            <option value="S1">Semestre 1</option><option value="S2">Semestre 2</option>
                            <option value="S3">Semestre 3</option><option value="S4">Semestre 4</option>
                            <option value="S5">Semestre 5</option><option value="S6">Semestre 6</option>
                        </select>
                    </div>
                    <textarea id="noteCommentaire" rows="2" placeholder="Commentaire (optionnel)" class="input-pro w-full mt-3 border p-2 rounded-xl"></textarea>
                    <button onclick="addSingleNote()" class="uts-green text-white px-6 py-2 rounded-xl font-bold mt-3">💾 Enregistrer</button>
                </div>
